plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = "${mod_version}+${minecraft_version}"
group = mod_group_id

base {
    archivesName = 'particle-physics-neoforge'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main.java.srcDir '../common/src/main/java'
sourceSets.main.resources.srcDir '../common/src/main/resources'

neoForge {
    version = neo_version

    runs {
        client {
            client()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

tasks.named('processResources', ProcessResources).configure {
    def minecraftVersionParts = minecraft_version.split('\\.')
    def minecraftVersionUpperBound =
            "${minecraftVersionParts[0]}.${Integer.parseInt(minecraftVersionParts[1]) + 1}"
    def replaceProperties = [
            mod_license          : mod_license,
            mod_id               : mod_id,
            mod_version          : project.version,
            mod_name             : mod_name,
            neo_version          : neo_version,
            minecraft_version    : minecraft_version,
            minecraft_version_range: "[${minecraft_version},${minecraftVersionUpperBound})"
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}
